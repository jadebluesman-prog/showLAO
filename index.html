<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างภาพผลหวยรายวัน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3EAD9; --paper:#FFFDF8; --ink:#2B241D; --muted:#8A7F6D; --line:#E3D3B8;
    --rust:#9C4A2E; --rust-dark:#7C3B24; --gold:#B08A3D;
    --sidebar-bg:#2B241D; --sidebar-text:#E9DFCB; --sidebar-muted:#9A8E77;
    --font-display:'Noto Serif Thai', serif; --font-body:'Noto Sans Thai', sans-serif; --font-mono:'JetBrains Mono', 'Noto Sans Thai', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink);}
  .page{max-width:960px;margin:0 auto;padding:0 16px 60px;}

  /* ---- Topbar ---- */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:32px 4px 22px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .mark{width:44px;height:44px;flex-shrink:0;border:1px solid var(--rust);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:21px;font-weight:700;color:var(--rust);}
  .brand h1{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin:0 0 4px;}
  .brand h4{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0;line-height:1.3;color:var(--ink);}
  .date-mono{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--rust);margin:0;letter-spacing:.02em;white-space:nowrap;}
  .date-block{text-align:right;}
  .clock-row{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--muted);margin-top:2px;letter-spacing:.03em;}

  /* ---- Layout: sidebar + content ---- */
  .layout{display:flex;align-items:flex-start;gap:22px;}
  .sidebar{width:212px;flex-shrink:0;background:var(--sidebar-bg);border-radius:16px;padding:16px 10px;position:sticky;top:16px;}
  .side-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
  .side-step{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;color:var(--sidebar-muted);cursor:pointer;font-family:var(--font-body);}
  .side-step .s-icon{font-size:16px;width:20px;text-align:center;}
  .side-step .s-num{font-family:var(--font-mono);font-size:11px;font-weight:700;opacity:.8;}
  .side-step .s-label{font-size:12.5px;font-weight:600;line-height:1.35;}
  .side-step:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--sidebar-text);}
  .side-step.active{background:var(--rust);color:#fff8f0;}
  .side-step.active .s-num{opacity:1;}
  .side-step:disabled{cursor:not-allowed;opacity:.45;}
  .content{flex:1;min-width:0;}

  @media (max-width:760px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;position:static;padding:10px;}
    .side-steps{flex-direction:row;overflow-x:auto;gap:6px;}
    .side-step{flex-direction:column;gap:3px;width:auto;flex-shrink:0;padding:9px 12px;text-align:center;}
    .side-step .s-label{font-size:10.5px;max-width:64px;}
    .topbar{padding-top:20px;}
    .date-mono{font-size:17px;}
    .split-right{position:static;}
  }

  /* ---- Cards ---- */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
  .card-kicker{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .card h2{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0 0 6px;color:var(--ink);}
  .card > p.desc{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px;}

  .row{display:flex;gap:10px;flex-wrap:wrap;}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;}
  input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:16px;background:#FBF6EC;color:var(--ink);}
  input[type=text]:read-only{color:var(--muted);background:#F1E9D9;}
  input[type=number]{width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:#FBF6EC;color:var(--ink);}
  input[type=color]{width:34px;height:30px;border:none;border-radius:7px;padding:0;background:none;cursor:pointer;}
  input[type=checkbox]{width:15px;height:15px;accent-color:var(--rust);cursor:pointer;}
  button{font-family:var(--font-body);font-size:13.5px;font-weight:600;border:none;border-radius:9px;padding:10px 16px;cursor:pointer;}
  .btn-primary{background:var(--rust);color:#fff8f0;}
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-primary:disabled{background:#d8c6b3;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--rust);border:1px solid var(--line);}
  .btn-ghost:hover{background:#F1E4CC;}
  .btn-block{width:100%;padding:13px;font-size:14px;}
  canvas{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;touch-action:none;background:#FBF6EC;}
  .field{margin-bottom:12px;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .hidden{display:none !important;}
  .boxrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;flex-wrap:wrap;}
  .boxrow .name{flex:1;font-size:12.5px;min-width:120px;}
  .boxrow .colors{display:flex;gap:6px;align-items:center;}
  .boxrow .transparent-toggle{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);}
  .stepper{font-size:13px;color:var(--rust);font-weight:600;margin-bottom:10px;}
  .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;}
  .upload-box{border:2px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;}
  .upload-box:hover{border-color:var(--rust);}
  .upload-box p{margin:8px 0 0;font-size:13px;color:var(--muted);}
  .small-link{font-size:12px;color:var(--rust);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
  .top-note{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .derived{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .derived span{background:#F1E4CC;color:var(--rust-dark);font-size:12.5px;padding:5px 10px;border-radius:8px;font-weight:600;}
  .split{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
  .split-left{flex:1 1 280px;min-width:0;}
  .split-right{flex:1 1 280px;min-width:0;position:sticky;top:16px;}
  .header-actions{font-size:12.5px;color:var(--muted);margin:2px 0 0;}
  .header-actions .act{margin-left:5px;}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="mark">๙</div>
      <div>
        <h1>Daily Number Studio</h1>
        <h4>สร้างภาพผลหวยรายวัน</h4>
        <div class="header-actions" id="templateActions"><span id="templateStatusLabel">จัดการเทมเพลต</span><span class="act req-tpl">· <button class="small-link" id="editTemplateBtn">แก้ไขเทมเพลต</button></span><span class="act">· <button class="small-link" id="addTemplateBtn">+ เทมเพลตใหม่</button></span><span class="act">· <button class="small-link" id="importTemplateBtn">นำเข้าเทมเพลต</button></span><span class="act req-tpl">· <button class="small-link" id="exportTemplateJsonBtn">ส่งออกเทมเพลตนี้</button></span><span class="act req-tpl">· <button class="small-link" id="exportTeamBtn">ส่งออกไฟล์ให้ทีม</button></span><span class="act req-tpl">· <button class="small-link" id="resetTemplateBtn">ล้างทั้งหมด</button></span>
          <input type="file" id="importTemplateFile" accept="application/json,.json" class="hidden">
        </div>
      </div>
    </div>
    <div class="date-block">
      <h2 class="date-mono" id="todayBadge"></h2>
      <div class="clock-row" id="clockBadge"></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="side-steps">
        <button type="button" class="side-step" data-step="0"><span class="s-icon">🖼️</span><span class="s-num">01</span><span class="s-label">เลือกภาพต้นฉบับ</span></button>
        <button type="button" class="side-step" data-step="1"><span class="s-icon">📍</span><span class="s-num">02</span><span class="s-label">กำหนดตำแหน่ง</span></button>
        <button type="button" class="side-step" data-step="2"><span class="s-icon">🎨</span><span class="s-num">03</span><span class="s-label">ปรับรายละเอียด</span></button>
        <button type="button" class="side-step" data-step="3"><span class="s-icon">🔢</span><span class="s-num">04</span><span class="s-label">ใส่เลขและส่งออก</span></button>
      </nav>
    </aside>

    <main class="content">
  <!-- STEP 1: upload -->
  <div id="uploadCard" class="card">
    <div class="upload-box" id="uploadBox">
      <div style="font-size:28px;">🖼️</div>
      <p>แตะเพื่อเลือกภาพเทมเพลต (ภาพตัวอย่างที่มีวันที่/เลขอยู่แล้วก็ใช้ได้)</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
  </div>

  <!-- STEP 2: draw boxes -->
  <div id="drawCard" class="card hidden">
    <div class="stepper" id="stepLabel"></div>
    <canvas id="drawCanvas"></canvas>
    <div class="footer-row">
      <button class="btn-ghost" id="undoBoxBtn">ย้อนกลับ</button>
      <span class="hint" id="drawHint"></span>
    </div>
  </div>

  <!-- STEP 3: styling -->
  <div id="styleCard" class="card hidden">
    <div class="split">
      <div class="split-left">
        <div class="field"><label>ชื่อเทมเพลตนี้</label><input type="text" id="templateNameInput" placeholder="เช่น หวยลาวพัฒนา"></div>
        <p class="top-note">ปรับสีพื้นหลัง / สีตัวอักษร / ขนาดตัวอักษร ของแต่ละช่องให้กลืนกับภาพ</p>
        <div id="styleFields" style="margin-top:12px;"></div>
        <div class="footer-row">
          <button class="btn-ghost" id="backToDrawBtn">แก้ไขตำแหน่ง</button>
          <button class="btn-primary" id="saveTemplateBtn">บันทึกเทมเพลต</button>
        </div>
      </div>
      <div class="split-right">
        <canvas id="styleCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- STEP 4: daily use -->
  <div id="dailyCard" class="card hidden">
    <div class="split">
      <div class="split-left">
        <div class="field" id="templateSelectField"><label>เทมเพลตที่ใช้งาน</label>
          <select id="templateSelect" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#FBF6EC;color:var(--ink);"></select>
        </div>
        <div class="field"><label>วันที่ (อัตโนมัติ วันนี้)</label><input type="text" id="dateInput" readonly></div>
        <div class="field"><label>เลขหกตัว</label><input type="text" id="sixInput" maxlength="6" inputmode="numeric" placeholder="เช่น 930768" style="font-size:20px;letter-spacing:2px;text-align:center;"></div>
        <div class="derived" id="derivedRow"></div>
        <button class="btn-primary btn-block" id="downloadBtn" style="margin-top:14px;">ดาวน์โหลดภาพ</button>
        <button class="btn-ghost btn-block" id="shareBtn" style="margin-top:8px;">แชร์ / คัดลอกรูป</button>
      </div>
      <div class="split-right">
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>
  </div>
    </main>
  </div>
</div>

<script>
(function(){
  // If this file was exported for team use, EMBEDDED_TEMPLATES below is replaced
  // with the real template library at export time — do not rename this line.
  const EMBEDDED_TEMPLATES = null; // __EMBEDDED_TEMPLATES_PLACEHOLDER__

  const STORAGE_KEY = 'lotto-templates-v2';
  const OLD_STORAGE_KEY = 'lotto-template-v1'; // single-template format, migrated on load
  const ORDER = ['date','six','twoUp','threeUp','twoLow'];
  const LABELS = {date:'กรอบ "วันที่"', six:'กรอบ "เลขหกตัว"', twoUp:'กรอบ "เลขสองตัวบน"', threeUp:'กรอบ "เลขสามตัวบน"', twoLow:'กรอบ "เลขสองตัวล่าง"'};
  const SAMPLES = {date:'วันที่ 22 กรกฎาคม 2569', six:'930768', twoUp:'68', threeUp:'768', twoLow:'07'};
  const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  let state = {
    imgEl:null, imgDataURL:null, naturalW:0, naturalH:0,
    boxes:{}, stepIndex:0, sampleCanvas:null, sampleCtx:null,
    currentStep:0, maxStepReached:0,
    templates:[], activeId:null, editingId:null
  };

  function newTemplateId(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  async function persistLibrary(){
    try{
      if(typeof window.storage !== 'undefined'){
        await window.storage.set(STORAGE_KEY, JSON.stringify({templates: state.templates, activeId: state.activeId}), false);
      }
    }catch(err){
      console.warn('บันทึกถาวรไม่ได้ในไฟล์นี้ (ปกติถ้าเปิดนอก Claude) แต่ใช้งานต่อได้ในตอนนี้', err);
    }
  }

  const el = id => document.getElementById(id);
  const uploadCard=el('uploadCard'), drawCard=el('drawCard'), styleCard=el('styleCard'), dailyCard=el('dailyCard');
  const cardsByIndex = [uploadCard, drawCard, styleCard, dailyCard];

  const stepMap = {uploadCard:0, drawCard:1, styleCard:2, dailyCard:3};
  function showOnly(card){
    [uploadCard,drawCard,styleCard,dailyCard].forEach(c=>c.classList.add('hidden'));
    card.classList.remove('hidden');
    const idx = stepMap[card.id];
    state.currentStep = idx;
    if(idx > state.maxStepReached) state.maxStepReached = idx;
    updateSidebar();
  }

  function updateSidebar(){
    document.querySelectorAll('.side-step').forEach(btn=>{
      const idx = parseInt(btn.dataset.step, 10);
      btn.classList.toggle('active', idx === state.currentStep);
      btn.disabled = idx > state.maxStepReached;
    });
  }
  document.querySelectorAll('.side-step').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.step, 10);
      if(idx > state.maxStepReached) return; // can revisit earlier steps, not skip ahead
      showOnly(cardsByIndex[idx]);
    });
  });

  function thaiDateString(){
    const p = bangkokParts();
    return `วันที่ ${parseInt(p.day,10)} ${THAI_MONTHS[parseInt(p.month,10)-1]} ${parseInt(p.year,10)+543}`;
  }

  function hexToRgb(hex){
    const v = parseInt(hex.slice(1),16);
    return {r:(v>>16)&255, g:(v>>8)&255, b:v&255};
  }
  function rgbToHex(r,g,b){
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  function contrastColor(hex){
    const {r,g,b}=hexToRgb(hex);
    const lum = (0.299*r+0.587*g+0.114*b)/255;
    return lum>0.6 ? '#1b2340' : '#ffffff';
  }

  // ---------- Upload ----------
  el('uploadBox').addEventListener('click', ()=> el('fileInput').click());
  el('fileInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => loadImageFromDataURL(ev.target.result);
    reader.readAsDataURL(file);
  });
  ['dragover','dragenter'].forEach(evt=>{
    el('uploadBox').addEventListener(evt, e=>{
      e.preventDefault();
      el('uploadBox').style.borderColor = 'var(--rust)';
      el('uploadBox').style.background = '#F6ECD9';
    });
  });
  ['dragleave','dragend'].forEach(evt=>{
    el('uploadBox').addEventListener(evt, e=>{
      el('uploadBox').style.borderColor = '';
      el('uploadBox').style.background = '';
    });
  });
  el('uploadBox').addEventListener('drop', e=>{
    e.preventDefault();
    el('uploadBox').style.borderColor = '';
    el('uploadBox').style.background = '';
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => loadImageFromDataURL(ev.target.result);
    reader.readAsDataURL(file);
  });

  // ---------- Today badge + live clock (always Thailand time, regardless of visitor's device) ----------
  const THAI_DAYS = {Sun:'อาทิตย์',Mon:'จันทร์',Tue:'อังคาร',Wed:'พุธ',Thu:'พฤหัสบดี',Fri:'ศุกร์',Sat:'เสาร์'};
  const SHORT_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  function bangkokParts(){
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone:'Asia/Bangkok', weekday:'short', year:'numeric', month:'numeric', day:'numeric',
      hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
    });
    const parts = fmt.formatToParts(new Date());
    const get = t => (parts.find(p=>p.type===t) || {}).value || '';
    return { weekday:get('weekday'), day:get('day'), month:get('month'), year:get('year'), hour:get('hour'), minute:get('minute'), second:get('second') };
  }
  function updateTodayBadge(){
    const p = bangkokParts();
    const thaiYear = parseInt(p.year,10) + 543;
    el('todayBadge').textContent = `วัน${THAI_DAYS[p.weekday] || ''} ${parseInt(p.day,10)} ${SHORT_MONTHS[parseInt(p.month,10)-1]} ${String(thaiYear).slice(-2)}`;
  }
  function updateClock(){
    const p = bangkokParts();
    el('clockBadge').textContent = `${p.hour}:${p.minute}:${p.second} น. (เวลาไทย)`;
  }
  updateTodayBadge();
  updateClock();
  setInterval(()=>{ updateTodayBadge(); updateClock(); }, 1000);

  function loadImageFromDataURL(dataURL){
    const img = new Image();
    img.onload = ()=>{
      // normalize / compress: max width 1000px, re-encode as jpeg
      const maxW = 1000;
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const normalized = c.toDataURL('image/jpeg', 0.88);
      const img2 = new Image();
      img2.onload = ()=>{
        state.imgEl = img2;
        state.imgDataURL = normalized;
        state.naturalW = w;
        state.naturalH = h;
        state.boxes = {};
        state.stepIndex = 0;
        buildSampleCanvas();
        startDrawFlow();
      };
      img2.src = normalized;
    };
    img.src = dataURL;
  }

  function buildSampleCanvas(){
    const c = document.createElement('canvas');
    c.width = state.naturalW; c.height = state.naturalH;
    c.getContext('2d').drawImage(state.imgEl, 0, 0, state.naturalW, state.naturalH);
    state.sampleCanvas = c;
    state.sampleCtx = c.getContext('2d');
  }

  function avgColorAt(rect){
    const cx = Math.round(rect.x + rect.w/2);
    const cy = Math.round(rect.y + rect.h/2);
    const size = 6;
    const x0 = Math.max(0, cx-size/2), y0 = Math.max(0, cy-size/2);
    const ww = Math.min(size, state.naturalW-x0), hh = Math.min(size, state.naturalH-y0);
    try{
      const data = state.sampleCtx.getImageData(x0,y0,Math.max(1,ww),Math.max(1,hh)).data;
      let r=0,g=0,b=0,n=0;
      for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
      return rgbToHex(Math.round(r/n), Math.round(g/n), Math.round(b/n));
    }catch(e){ return '#4a5fd6'; }
  }

  // ---------- Draw boxes step ----------
  const drawCanvas = el('drawCanvas');
  const dctx = drawCanvas.getContext('2d');
  let drawScale = 1, dragging=false, dragStart=null, dragCurrent=null;

  function startDrawFlow(){
    showOnly(drawCard);
    const maxDisplayW = 520;
    drawScale = Math.min(1, maxDisplayW / state.naturalW);
    drawCanvas.width = Math.round(state.naturalW * drawScale);
    drawCanvas.height = Math.round(state.naturalH * drawScale);
    state.stepIndex = 0;
    updateStepLabel();
    redrawDraw();
  }

  function updateStepLabel(){
    if(state.stepIndex >= ORDER.length){ finishDrawing(); return; }
    const key = ORDER[state.stepIndex];
    el('stepLabel').textContent = `ขั้นตอน ${state.stepIndex+1}/${ORDER.length}: ลากกรอบรอบตำแหน่ง ${LABELS[key]}`;
    el('drawHint').textContent = `ตัวอย่างค่า: ${SAMPLES[key]}`;
  }

  function redrawDraw(previewRect){
    dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    dctx.drawImage(state.imgEl, 0, 0, drawCanvas.width, drawCanvas.height);
    dctx.lineWidth = 2;
    ORDER.forEach(key=>{
      const b = state.boxes[key];
      if(!b) return;
      dctx.strokeStyle = '#2ecc71';
      dctx.strokeRect(b.x*drawScale, b.y*drawScale, b.w*drawScale, b.h*drawScale);
    });
    if(previewRect){
      dctx.strokeStyle = '#4a5fd6';
      dctx.setLineDash([5,4]);
      dctx.strokeRect(previewRect.x, previewRect.y, previewRect.w, previewRect.h);
      dctx.setLineDash([]);
    }
  }

  function canvasPoint(e){
    const rect = drawCanvas.getBoundingClientRect();
    const scaleX = drawCanvas.width / rect.width;
    const scaleY = drawCanvas.height / rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }

  drawCanvas.addEventListener('pointerdown', e=>{
    if(state.stepIndex >= ORDER.length) return;
    dragging = true;
    dragStart = canvasPoint(e);
    drawCanvas.setPointerCapture(e.pointerId);
  });
  drawCanvas.addEventListener('pointermove', e=>{
    if(!dragging) return;
    dragCurrent = canvasPoint(e);
    const x = Math.min(dragStart.x, dragCurrent.x), y = Math.min(dragStart.y, dragCurrent.y);
    const w = Math.abs(dragCurrent.x-dragStart.x), h = Math.abs(dragCurrent.y-dragStart.y);
    redrawDraw({x,y,w,h});
  });
  drawCanvas.addEventListener('pointerup', e=>{
    if(!dragging) return;
    dragging = false;
    const end = canvasPoint(e);
    const x = Math.min(dragStart.x, end.x) / drawScale;
    const y = Math.min(dragStart.y, end.y) / drawScale;
    const w = Math.abs(end.x-dragStart.x) / drawScale;
    const h = Math.abs(end.y-dragStart.y) / drawScale;
    if(w < 4 || h < 4){ redrawDraw(); return; } // ignore accidental tap
    const key = ORDER[state.stepIndex];
    const rect = {x,y,w,h};
    const bg = avgColorAt(rect);
    state.boxes[key] = {
      x, y, w, h,
      bg: bg,
      color: contrastColor(bg),
      fontSize: Math.max(10, Math.round(h*0.62)),
      transparent: false,
      letterSpacing: 0,
      justify: false
    };
    state.stepIndex++;
    updateStepLabel();
    redrawDraw();
  });

  el('undoBoxBtn').addEventListener('click', ()=>{
    if(state.stepIndex === 0) return;
    state.stepIndex--;
    delete state.boxes[ORDER[state.stepIndex]];
    updateStepLabel();
    redrawDraw();
  });

  // ---------- Style step ----------
  const styleCanvas = el('styleCanvas');
  const sctx = styleCanvas.getContext('2d');
  let styleScale = 1;

  function finishDrawing(){
    showOnly(styleCard);
    const maxDisplayW = 520;
    styleScale = Math.min(1, maxDisplayW / state.naturalW);
    styleCanvas.width = Math.round(state.naturalW * styleScale);
    styleCanvas.height = Math.round(state.naturalH * styleScale);
    const existing = state.editingId ? state.templates.find(t => t.id === state.editingId) : null;
    el('templateNameInput').value = existing ? existing.name : `เทมเพลต ${state.templates.length + 1}`;
    buildStyleFields();
    redrawStyle();
  }

  function buildStyleFields(){
    const container = el('styleFields');
    container.innerHTML = '';
    ORDER.forEach(key=>{
      const b = state.boxes[key];
      if(b.letterSpacing === undefined) b.letterSpacing = 0;
      if(b.justify === undefined) b.justify = false;
      const row = document.createElement('div');
      row.className = 'boxrow';
      row.innerHTML = `
        <span class="name">${LABELS[key]}</span>
        <div class="colors">
          <label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin:0;">
            <input type="checkbox" data-key="${key}" data-role="transparent" ${b.transparent ? 'checked' : ''} style="width:14px;height:14px;">
            โปร่งใส
          </label>
          <input type="color" data-key="${key}" data-role="bg" value="${b.bg}" title="สีพื้นหลัง" ${b.transparent ? 'disabled' : ''}>
          <input type="color" data-key="${key}" data-role="color" value="${b.color}" title="สีตัวอักษร">
          <input type="number" data-key="${key}" data-role="fontSize" value="${b.fontSize}" min="8" max="200" title="ขนาดตัวอักษร">
        </div>
        <div class="colors" style="width:100%;margin-top:6px;">
          <label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin:0;">
            <input type="checkbox" data-key="${key}" data-role="justify" ${b.justify ? 'checked' : ''} style="width:14px;height:14px;">
            เต็มกรอบอัตโนมัติ (ตัวแรกชิดซ้าย ตัวสุดท้ายชิดขวา)
          </label>
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin:0 0 0 auto;">
            ระยะห่าง
            <input type="number" data-key="${key}" data-role="letterSpacing" value="${b.letterSpacing}" min="0" max="200" step="1" title="ระยะห่างระหว่างตัวอักษร (px)" ${b.justify ? 'disabled' : ''} style="width:52px;">
          </label>
        </div>`;
      container.appendChild(row);
    });
    container.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const {key, role} = e.target.dataset;
        let val;
        if(role === 'fontSize' || role === 'letterSpacing') val = parseInt(e.target.value||'0',10);
        else if(role === 'transparent' || role === 'justify') val = e.target.checked;
        else val = e.target.value;
        state.boxes[key][role] = val;
        if(role === 'transparent'){
          const bgInput = container.querySelector(`input[data-key="${key}"][data-role="bg"]`);
          if(bgInput) bgInput.disabled = val;
        }
        if(role === 'justify'){
          const spacingInput = container.querySelector(`input[data-key="${key}"][data-role="letterSpacing"]`);
          if(spacingInput) spacingInput.disabled = val;
        }
        redrawStyle();
      });
    });
  }

  function drawBoxText(ctx, box, text, scale){
    const x = box.x*scale, y = box.y*scale, w = box.w*scale, h = box.h*scale;
    if(!box.transparent){
      ctx.fillStyle = box.bg;
      ctx.fillRect(x, y, w, h);
    }
    if(!text){ return; }
    const chars = String(text).split('');
    let fontSize = box.fontSize * scale;
    const manualSpacing = (box.letterSpacing || 0) * scale;
    const padding = w * 0.05; // small inset so justified text doesn't touch the box edges
    const availW = w - padding * 2;

    function measureChars(fs){
      ctx.font = `700 ${fs}px 'Noto Sans Thai', sans-serif`;
      return chars.map(ch => ctx.measureText(ch).width);
    }

    let widths, spacing;
    if(box.justify && chars.length > 1){
      // shrink font so raw glyphs fit, then spread the leftover space evenly
      widths = measureChars(fontSize);
      let sumW = widths.reduce((a,b)=>a+b,0);
      while(sumW > availW && fontSize > 6){
        fontSize -= 1;
        widths = measureChars(fontSize);
        sumW = widths.reduce((a,b)=>a+b,0);
      }
      spacing = Math.max(0, (availW - sumW) / (chars.length - 1));
    }else{
      widths = measureChars(fontSize);
      let totalW = widths.reduce((a,b)=>a+b,0) + manualSpacing * (chars.length - 1);
      while(totalW > w*0.94 && fontSize > 6){
        fontSize -= 1;
        widths = measureChars(fontSize);
        totalW = widths.reduce((a,b)=>a+b,0) + manualSpacing * (chars.length - 1);
      }
      spacing = manualSpacing;
    }

    const totalW = widths.reduce((a,b)=>a+b,0) + spacing * (chars.length - 1);
    const startX = box.justify ? (x + padding) : (x + w/2 - totalW/2);
    const cy = y + h/2 + fontSize*0.03;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    if(box.transparent){
      let curX = startX;
      ctx.lineWidth = Math.max(2, fontSize*0.09);
      ctx.strokeStyle = box.color === '#ffffff' ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.75)';
      for(let i=0;i<chars.length;i++){
        ctx.strokeText(chars[i], curX, cy);
        curX += widths[i] + spacing;
      }
    }
    let curX = startX;
    ctx.fillStyle = box.color;
    for(let i=0;i<chars.length;i++){
      ctx.fillText(chars[i], curX, cy);
      curX += widths[i] + spacing;
    }
  }

  function redrawStyle(){
    sctx.clearRect(0,0,styleCanvas.width,styleCanvas.height);
    sctx.drawImage(state.imgEl, 0, 0, styleCanvas.width, styleCanvas.height);
    ORDER.forEach(key=>{
      drawBoxText(sctx, state.boxes[key], SAMPLES[key], styleScale);
    });
  }

  el('backToDrawBtn').addEventListener('click', startDrawFlow);

  el('saveTemplateBtn').addEventListener('click', async ()=>{
    const btn = el('saveTemplateBtn');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    const name = (el('templateNameInput').value || '').trim() || `เทมเพลต ${state.templates.length + 1}`;
    const entry = {
      id: state.editingId || newTemplateId(),
      name,
      image: state.imgDataURL,
      naturalW: state.naturalW,
      naturalH: state.naturalH,
      boxes: state.boxes
    };
    const json = JSON.stringify(entry);
    if(json.length > 4700000){
      alert('ภาพเทมเพลตมีขนาดใหญ่เกินไป กรุณาลองใช้ภาพที่มีขนาดไฟล์เล็กลง');
      btn.disabled = false; btn.textContent = 'บันทึกเทมเพลต';
      return;
    }
    const existingIdx = state.templates.findIndex(t => t.id === entry.id);
    if(existingIdx >= 0) state.templates[existingIdx] = entry;
    else state.templates.push(entry);
    state.activeId = entry.id;
    state.editingId = null;
    await persistLibrary();
    syncTemplateSelect();
    goToDaily();
    btn.disabled = false; btn.textContent = 'บันทึกเทมเพลต';
  });

  // ---------- Daily use ----------
  const previewCanvas = el('previewCanvas');
  const pctx = previewCanvas.getContext('2d');

  function goToDaily(){
    showOnly(dailyCard);
    updateTemplateActionsBar();
    syncTemplateSelect();
    el('dateInput').value = thaiDateString();
    previewCanvas.width = state.naturalW;
    previewCanvas.height = state.naturalH;
    renderPreview();
  }

  function updateTemplateActionsBar(){
    const has = state.templates.length > 0;
    el('templateStatusLabel').textContent = has ? 'เทมเพลตพร้อมใช้งาน' : 'ยังไม่มีเทมเพลต';
    document.querySelectorAll('#templateActions .req-tpl').forEach(btn=>{
      btn.classList.toggle('hidden', !has);
    });
  }
  updateTemplateActionsBar(); // show the right buttons immediately on the first page too

  function syncTemplateSelect(){
    const sel = el('templateSelect');
    sel.innerHTML = '';
    state.templates.forEach(t=>{
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      if(t.id === state.activeId) opt.selected = true;
      sel.appendChild(opt);
    });
    el('templateSelectField').classList.toggle('hidden', state.templates.length <= 1);
  }

  function switchActiveTemplate(id){
    const tpl = state.templates.find(t => t.id === id);
    if(!tpl) return;
    const img = new Image();
    img.onload = ()=>{
      state.imgEl = img;
      state.imgDataURL = tpl.image;
      state.naturalW = tpl.naturalW;
      state.naturalH = tpl.naturalH;
      state.boxes = JSON.parse(JSON.stringify(tpl.boxes));
      state.activeId = id;
      buildSampleCanvas();
      persistLibrary();
      previewCanvas.width = state.naturalW;
      previewCanvas.height = state.naturalH;
      renderPreview();
    };
    img.onerror = ()=>{
      alert('โหลดภาพเทมเพลต "' + (tpl.name || '') + '" ไม่สำเร็จ\n\n' +
        'สาเหตุที่พบบ่อยที่สุด: เว็บโฮสต์ของคุณตั้งค่า Content Security Policy (CSP) บล็อกรูปภาพที่ฝังอยู่ในไฟล์ (data: URI)\n\n' +
        'วิธีเช็ค: เปิดไฟล์นี้จากเครื่องโดยตรง (ดับเบิลคลิก) ถ้าภาพขึ้นปกติ แปลว่าปัญหาอยู่ที่การตั้งค่าโฮสต์ ไม่ใช่ไฟล์เสีย\n' +
        'หรือกด F12 เปิด Console แล้วดูข้อความ error สีแดงที่พูดถึง "Content Security Policy" หรือ "data:"');
    };
    img.src = tpl.image;
  }

  el('templateSelect').addEventListener('change', e=>{
    switchActiveTemplate(e.target.value);
  });

  function renderPreview(){
    const six = el('sixInput').value.replace(/\D/g,'').slice(0,6);
    const twoUp = six.slice(-2);
    const threeUp = six.slice(-3);
    const twoLow = six.length === 6 ? six.substring(2,4) : ''; // digits 3-4
    el('derivedRow').innerHTML = `<span>สองตัวบน: ${twoUp || '--'}</span><span>สามตัวบน: ${threeUp || '---'}</span><span>สองตัวล่าง: ${twoLow || '--'}</span>`;

    pctx.clearRect(0,0,previewCanvas.width, previewCanvas.height);
    pctx.drawImage(state.imgEl, 0, 0, previewCanvas.width, previewCanvas.height);
    const values = {
      date: thaiDateString(),
      six: six || '——————',
      twoUp: twoUp || '——',
      threeUp: threeUp || '———',
      twoLow: twoLow || '——'
    };
    ORDER.forEach(key=>{
      drawBoxText(pctx, state.boxes[key], values[key], 1);
    });
  }

  el('sixInput').addEventListener('input', e=>{ e.target.value = e.target.value.replace(/\D/g,'').slice(0,6); renderPreview(); });

  el('downloadBtn').addEventListener('click', ()=>{
    if(!validateInputsRef()) return;
    const link = document.createElement('a');
    link.download = outFilenameRef();
    link.href = previewCanvas.toDataURL('image/png');
    link.click();
  });
  // small forward-refs so downloadBtn (defined earlier in file) can reuse the
  // validateInputs/outFilename helpers defined later in the Share section
  function validateInputsRef(){
    const six = el('sixInput').value;
    if(six.length !== 6){
      alert('กรุณากรอกเลขหกตัวให้ครบ 6 หลัก');
      return false;
    }
    return true;
  }
  function outFilenameRef(){
    const now = new Date();
    return `ผลหวย_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.png`;
  }

  el('editTemplateBtn').addEventListener('click', ()=>{
    if(!state.activeId){ alert('ยังไม่มีเทมเพลตให้แก้ไข กรุณาอัปโหลดภาพและตั้งค่าก่อน'); return; }
    state.editingId = state.activeId;
    finishDrawing();
  });

  el('addTemplateBtn').addEventListener('click', ()=>{
    state.editingId = null;
    state.imgEl = null; state.imgDataURL = null; state.naturalW = 0; state.naturalH = 0; state.boxes = {};
    showOnly(uploadCard);
  });

  el('resetTemplateBtn').addEventListener('click', async ()=>{
    if(!confirm('ต้องการล้างเทมเพลตทั้งหมดในไฟล์นี้และเริ่มใหม่หรือไม่? (ลบทุกเทมเพลตที่มี)')) return;
    try{ if(typeof window.storage !== 'undefined') await window.storage.delete(STORAGE_KEY, false); }catch(e){}
    state = {imgEl:null, imgDataURL:null, naturalW:0, naturalH:0, boxes:{}, stepIndex:0, sampleCanvas:null, sampleCtx:null, currentStep:0, maxStepReached:0, templates:[], activeId:null, editingId:null};
    updateTemplateActionsBar();
    showOnly(uploadCard);
  });

  function loadLibrary(data){
    state.templates = data.templates || [];
    state.activeId = data.activeId || (state.templates[0] && state.templates[0].id) || null;
    if(!state.activeId){ showOnly(uploadCard); return; }
    switchActiveTemplate(state.activeId);
    goToDaily();
  }

  // ---------- Import / export a single template as .json ----------
  el('importTemplateBtn').addEventListener('click', ()=> el('importTemplateFile').click());
  el('importTemplateFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev=>{
      let data;
      try{ data = JSON.parse(ev.target.result); }
      catch(err){ alert('ไฟล์นี้ไม่ใช่ไฟล์เทมเพลตที่ถูกต้อง'); return; }
      const incoming = Array.isArray(data) ? data : (data.templates ? data.templates : [data]);
      let lastId = null;
      incoming.forEach(t=>{
        if(!t || !t.image || !t.boxes) return;
        const id = newTemplateId();
        state.templates.push({id, name: t.name || `เทมเพลตนำเข้า ${state.templates.length+1}`, image:t.image, naturalW:t.naturalW, naturalH:t.naturalH, boxes:t.boxes});
        lastId = id;
      });
      if(!lastId){ alert('ไม่พบข้อมูลเทมเพลตในไฟล์นี้'); return; }
      state.activeId = lastId;
      await persistLibrary();
      switchActiveTemplate(lastId);
      goToDaily();
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  el('exportTemplateJsonBtn').addEventListener('click', ()=>{
    const tpl = state.templates.find(t => t.id === state.activeId);
    if(!tpl){ alert('ยังไม่มีเทมเพลตที่ใช้งานอยู่'); return; }
    const blob = new Blob([JSON.stringify(tpl)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (tpl.name || 'เทมเพลต').replace(/[\\/:*?"<>|]/g,'_') + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  // ---------- Export standalone file for team (bundles every template) ----------
  el('exportTeamBtn').addEventListener('click', ()=>{
    if(state.templates.length === 0){ alert('ยังไม่มีเทมเพลตให้ส่งออก กรุณาสร้างอย่างน้อย 1 เทมเพลตก่อน'); return; }
    const payload = { templates: state.templates, activeId: state.activeId };
    const marker = "const EMBEDDED_TEMPLATES = null; // __EMBEDDED_TEMPLATES_PLACEHOLDER__";
    const replacement = "const EMBEDDED_TEMPLATES = " + JSON.stringify(payload) + ";";
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    if(html.indexOf(marker) === -1){
      alert('ไม่พบตำแหน่งฝังข้อมูลในไฟล์ กรุณาลองใหม่อีกครั้ง');
      return;
    }
    html = html.replace(marker, replacement);
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'สร้างภาพผลหวยรายวัน_ทีม.html';
    a.click();
    URL.revokeObjectURL(url);
  });

  // ---------- Share / copy generated image ----------
  function outFilename(){
    const now = new Date();
    return `ผลหวย_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.png`;
  }
  function validateInputs(){
    const six = el('sixInput').value;
    if(six.length !== 6){
      alert('กรุณากรอกเลขหกตัวให้ครบ 6 หลัก');
      return false;
    }
    return true;
  }
  function canvasToBlob(){
    return new Promise(resolve => previewCanvas.toBlob(resolve, 'image/png'));
  }
  el('shareBtn').addEventListener('click', async ()=>{
    if(!validateInputs()) return;
    const blob = await canvasToBlob();
    if(!blob){ alert('สร้างรูปไม่สำเร็จ ลองอีกครั้ง'); return; }
    const file = new File([blob], outFilename(), {type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'ผลหวย'}); }
      catch(e){ /* user cancelled share sheet, ignore */ }
      return;
    }
    if(navigator.clipboard && window.ClipboardItem){
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        alert('คัดลอกรูปแล้ว วางในแชทหรือแอปอื่นได้เลย');
        return;
      }catch(e){ /* fall through */ }
    }
    alert('อุปกรณ์นี้ไม่รองรับการแชร์/คัดลอกอัตโนมัติ กรุณาใช้ปุ่มดาวน์โหลดแทน');
  });

  // ---------- Init ----------
  (async function init(){
    try{
      document.fonts.load("700 40px 'Noto Sans Thai'");
      await document.fonts.ready;
    }catch(e){ /* font loading API unsupported — proceed anyway */ }
    if(EMBEDDED_TEMPLATES){
      loadLibrary(EMBEDDED_TEMPLATES);
      return;
    }
    try{
      if(typeof window.storage !== 'undefined'){
        const res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value){
          loadLibrary(JSON.parse(res.value));
          return;
        }
        // migrate a single-template save from the previous version of this tool
        const old = await window.storage.get(OLD_STORAGE_KEY, false).catch(()=>null);
        if(old && old.value){
          const oldData = JSON.parse(old.value);
          const id = newTemplateId();
          loadLibrary({ templates:[{id, name:'เทมเพลต 1', image:oldData.image, naturalW:oldData.naturalW, naturalH:oldData.naturalH, boxes:oldData.boxes}], activeId:id });
          await persistLibrary();
          return;
        }
      }
    }catch(e){ /* no saved template yet */ }
    showOnly(uploadCard);
  })();
})();
</script>
</body>
</html>
